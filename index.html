<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言管理后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
body{padding:20px;max-width:800px;margin:0 auto;background:#f3f4f6;}
.box{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #00000010;}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;font-size:16px;}
button{padding:10px 16px;border:none;border-radius:8px;cursor:pointer;margin-right:8px;}
.btn-login{background:#2563eb;color:#fff;}
.btn-del{background:#dc2626;color:#fff;}
.item{padding:12px;border-bottom:1px solid #eee;}
</style>
</head>
<body>
<div class="box" id="loginBox">
  <h3>后台登录</h3>
  <input type="password" id="pwd" placeholder="输入后台密码">
  <button class="btn-login" onclick="login()">登录</button>
</div>
<div id="mainBox" style="display:none">
  <div class="box">
    <h3>全部留言</h3>
    <div id="list"></div>
  </div>
</div>

<script>
// ==========在这里改你的后台密码==========
const ADMIN_PWD = "123456";
// ======================================

async function loadList(){
  const res = await fetch("/api/msg");
  const data = await res.json();
  const wrap = document.getElementById("list");
  wrap.innerHTML = "";
  data.forEach((item,idx)=>{
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML = `
      <div>昵称：${escapeHtml(item.name)}</div>
      <div>内容：${escapeHtml(item.content)}</div>
      <div>时间：${escapeHtml(item.time)}</div>
      <button class="btn-del" onclick="del(${idx})">删除</button>
    `;
    wrap.appendChild(div);
  })
}
async function del(index){
  if(!confirm("确定删除这条？"))return;
  const res = await fetch("/api/msg",{
    method:"DELETE",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({index})
  })
  const ret = await res.json();
  if(ret.ok) loadList();
  else alert("删除失败");
}
function login(){
  const p = document.getElementById("pwd").value.trim();
  if(p === ADMIN_PWD){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("mainBox").style.display="block";
    loadList();
  }else{
    alert("密码错误");
  }
}
function escapeHtml(str){
  return String(str)
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'","&#039;")
}
</script>
</body>
</html>
