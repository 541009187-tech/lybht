<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云端留言板</title>
<!-- lybht.pages.dev 专属必应验证标签 -->
<meta name="msvalidate.01" content="5375C1040004CDBEFCF73F7C9133AD5E" />
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
body{padding:16px;max-width:720px;margin:0 auto;background:#f6f7f9;color:#222;}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #00000012;}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0;font-size:16px;}
button{width:100%;padding:14px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;}
.msg-item{border-bottom:1px solid #eee;padding:12px 0;}
.msg-name{font-weight:bold;color:#2563eb;}
.msg-time{font-size:12px;color:#888;margin:4px 0;}
.msg-content{word-break:break-all;}
</style>
</head>
<body>
<div class="card">
  <h3>📝发表留言</h3>
  <input id="name" placeholder="昵称" autocomplete="off">
  <textarea id="content" rows="4" placeholder="写下留言..." autocomplete="off"></textarea>
  <button id="submitBtn">提交留言</button>
</div>

<div class="card">
  <h3>📋全部留言</h3>
  <div id="msgList"></div>
</div>

<!-- 隐藏内链，帮助必应爬虫发现 /api/msg 接口（肉眼不可见） -->
<a href="/api/msg" style="display:none">留言数据接口</a>

<script>
const msgList = document.getElementById('msgList');
const submitBtn = document.getElementById('submitBtn');
const nameInp = document.getElementById('name');
const contentInp = document.getElementById('content');

async function loadMsg(){
  try{
    const res = await fetch('/api/msg');
    const data = await res.json();
    render(data)
  }catch(e){
    console.error('加载留言异常',e);
  }
}
function render(list){
  msgList.innerHTML = '';
  if(!list || !list.length){
    msgList.innerHTML = '<p>暂无留言</p>';
    return;
  }
  list.forEach(item=>{
    const div = document.createElement('div');
    div.className = 'msg-item';
    div.innerHTML = `
      <div class="msg-name">${escapeHtml(item.name)}</div>
      <div class="msg-time">${item.time}</div>
      <div class="msg-content">${escapeHtml(item.content)}</div>
    `;
    msgList.appendChild(div);
  })
}
function escapeHtml(str){
  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;")
}

submitBtn.addEventListener('click',async ()=>{
  const name = nameInp.value.trim();
  const content = contentInp.value.trim();
  if(!name || !content) return alert('昵称和留言不能为空');
  submitBtn.disabled = true;
  submitBtn.textContent = '提交中...';
  try{
    const res = await fetch('/api/msg',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,content})
    })
    const ret = await res.json();
    if(ret.ok){
      alert('留言成功！');
      nameInp.value = '';
      contentInp.value = '';
      loadMsg();
    }else{
      alert('失败：'+ret.msg)
    }
  }catch(e){
    console.error('提交异常',e);
    alert('网络异常，请重试');
  }
  submitBtn.disabled = false;
  submitBtn.textContent = '提交留言';
})

loadMsg();
</script>
</body>
</html>
